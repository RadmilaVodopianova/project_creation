{% extends 'base.html' %}
{% block content %}
<h1 class="page-title">Підписка на новини блогу</h1>
{% for message in messages %}
    <div class="alert alert-success" role="status">{{ message }}</div>
{% endfor %}
<div class="comment-box">
    <form method="post" action="{% url 'blog:subscribe' %}">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="form-group">
            {{ form.email.label_tag }}
            {{ form.email }}
            {{ form.email.errors }}
        </div>
        <button class="btn btn-accent mt-3" type="submit">Підписатися</button>
    </form>
</div>
{% endblock %}
