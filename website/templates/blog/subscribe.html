{% extends 'base.html' %}
{% block content %}
<section class="form-panel auth-panel">
    <span class="eyebrow">JOURNAL / ЗАЛИШАЙМОСЯ НА ЗВ’ЯЗКУ</span>
    <h1 class="form-heading">Нові історії — на пошту</h1>
    <p class="form-intro">Підпишіться на новини нашого блогу.</p>
    {% for message in messages %}
        <div class="alert alert-success" role="status">{{ message }}</div>
    {% endfor %}
    <form method="post" action="{% url 'blog:subscribe' %}" class="journal-form">
        {% csrf_token %}
        {% include 'blog/includes/form_fields.html' %}
        <button class="btn btn-accent form-submit" type="submit">Підписатися</button>
    </form>
</section>
{% endblock %}
