{% extends 'base.html' %}
{% block content %}
<section class="form-panel auth-panel" aria-labelledby="register-title">
    <span class="eyebrow">JOURNAL / ПРИЄДНУЙТЕСЯ</span>
    <h1 id="register-title" class="form-heading">Створіть свій акаунт</h1>
    <p class="form-intro">Діліться думками, публікуйте історії та знаходьте натхнення.</p>
    <form method="post" class="journal-form">
        {% csrf_token %}
        {% include 'blog/includes/form_fields.html' %}
        <button type="submit" class="btn btn-accent form-submit">Зареєструватися</button>
    </form>
    <p class="form-footer">Уже є акаунт? <a href="{% url 'blog:login' %}">Увійти</a></p>
</section>
{% endblock %}
